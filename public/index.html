<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<script language="JavaScript" type="text/javascript" src="java/word.js"></script>
<title>エイラ占い</title>
<link href="css/eira.css" rel="stylesheet" type="text/css" />
</head>
<body>
<div class="uranai" id="uranai"><SCRIPT language="JavaScript">randomCard();</SCRIPT></div>

<div class="talot-close"><a href="#" onClick="javascript:window.close()"><img src="img/talot-close.gif" alt="close" width="68" height="22" border="0" /></a></div>

<script>
function scaleUranai() {
    var uranai = document.getElementById('uranai');
    var scaleX = window.innerWidth / 380;
    var scaleY = window.innerHeight / 540;
    var scale = Math.min(scaleX, scaleY);
    uranai.style.transform = 'scale(' + scale + ')';
    uranai.style.transformOrigin = 'top left';
}
window.addEventListener('load', scaleUranai);
window.addEventListener('resize', scaleUranai);
</script>
</body>
</html>
